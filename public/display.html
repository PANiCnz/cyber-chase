
<!DOCTYPE html>
<html>
<head>
  <title>Cyber Chase Display</title>
  <link rel="stylesheet" href="/css/display.css">
</head>
<body>
<div class="header">
  <h1>CYBER CHASE</h1>
  <h2>THE CHASE IS ON!</h2>
</div>

<div class="scoreboard">
  <div class="player-card">
    <div class="player-details">
      <div id="contestantName" class="player-name">Contestant</div>
    </div>
    <div class="progress" role="progressbar" aria-label="Contestant score" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
      <div id="contestantBar" class="bar"></div>
    </div>
  </div>

  <div class="player-card">
    <div class="player-details">
      <div id="chaserName" class="player-name">Chaser</div>
      <div id="chaserTitle" class="chaser-title hidden"></div>
      <div id="chaserDepartment" class="chaser-department">Information Security</div>
      <div id="chaserBio" class="chaser-bio hidden"></div>
    </div>
    <div class="progress" role="progressbar" aria-label="Chaser score" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
      <div id="chaserBar" class="bar"></div>
    </div>
  </div>
</div>

<div id="currentTurn" class="turn contestant-turn">CONTESTANT TURN</div>
<div id="category" class="category"></div>

<div id="questionPanel" class="question-panel">
  <div id="questionText"></div>
  <div id="answers">
    <div>A. <span id="displayAnswerA"></span></div>
    <div>B. <span id="displayAnswerB"></span></div>
    <div>C. <span id="displayAnswerC"></span></div>
    <div>D. <span id="displayAnswerD"></span></div>
  </div>
</div>

<div id="timer" class="timer">60</div>
<div id="answerResultOverlay" class="answer-result-overlay hidden" role="status" aria-live="assertive">
  <div id="answerResultPlayer" class="answer-result-player"></div>
  <div id="answerResultMessage" class="answer-result-message"></div>
  <div id="answerResultCorrect" class="answer-result-correct hidden"></div>
</div>
<div id="winnerScreen" class="winner hidden" role="status" aria-live="assertive">
  <div id="winnerName"></div>
  <div>WINS!</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/display.js"></script>
</body>
</html>
