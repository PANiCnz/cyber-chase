
<!DOCTYPE html>
<html>
<head>
  <title>Cyber Chase Display</title>
  <link rel="stylesheet" href="/css/display.css">
</head>
<body>
<div class="header">
  <h1>CYBER CHASE</h1>
  <h2>THE CHASE IS ON!</h2>
</div>

<div class="scoreboard">
  <div class="player-card">
    <div id="contestantName">Contestant</div>
    <div class="progress"><div id="contestantBar" class="bar"></div></div>
  </div>

  <div class="player-card">
    <div id="chaserName">Chaser</div>
    <div id="chaserTitle" class="chaser-title hidden"></div>
    <div id="chaserDepartment" class="chaser-department">Information Security</div>
    <div id="chaserBio" class="chaser-bio hidden"></div>
    <div class="progress"><div id="chaserBar" class="bar"></div></div>
  </div>
</div>

<div id="currentTurn" class="turn contestant-turn">CONTESTANT TURN</div>
<div id="category" class="category"></div>

<div id="questionPanel" class="question-panel">
  <div id="questionText"></div>
  <div id="answers"></div>
</div>

<div id="timer" class="timer">60</div>
<div id="winnerScreen" class="winner hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/display.js"></script>
</body>
</html>
