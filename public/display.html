<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Chase Display</title>
  <link rel="stylesheet" href="/css/display.css">
</head>
<body>
<main class="display-shell">
  <header class="brand-header">
    <div class="brand-rule red-rule"></div>
    <div>
      <div class="brand-kicker">CYBER SMART WEEK</div>
      <h1>CYBER CHASE</h1>
    </div>
    <div class="brand-rule blue-rule"></div>
  </header>

  <section class="scoreboard" aria-label="Match scores">
    <article class="player-card contestant-card">
      <div class="player-details">
        <div id="contestantName" class="player-name">Team</div>
        <div class="side-label">TEAM</div>
      </div>
      <div id="contestantBar" class="score-segments" role="progressbar" aria-label="Team score" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
      </div>
    </article>

    <div class="timer-stage">
      <div class="timer-label">ROUND TIMER</div>
      <div
        id="timer"
        class="timer"
        role="timer"
        aria-label="120 seconds remaining"
      >120</div>
    </div>

    <article class="player-card chaser-card">
      <div class="player-details">
        <div id="chaserTitle" class="player-name">The Chaser</div>
        <div class="side-label">CHASER</div>
      </div>
      <div id="chaserBar" class="score-segments" role="progressbar" aria-label="Chaser score" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
        <span class="score-segment"></span>
      </div>
    </article>
  </section>

  <section class="question-stage">
    <div class="question-status">
      <div id="currentTurn" class="turn contestant-turn">TEAM TURN</div>
      <div id="category" class="category"></div>
    </div>

    <div id="questionPanel" class="question-panel contestant-question">
      <div id="questionText"></div>
      <div id="answers">
        <div class="answer-option"><span class="answer-key">A</span><span id="displayAnswerA"></span></div>
        <div class="answer-option"><span class="answer-key">B</span><span id="displayAnswerB"></span></div>
        <div class="answer-option"><span class="answer-key">C</span><span id="displayAnswerC"></span></div>
        <div class="answer-option"><span class="answer-key">D</span><span id="displayAnswerD"></span></div>
      </div>
    </div>
  </section>
</main>

<div id="answerResultOverlay" class="answer-result-overlay hidden" role="status" aria-live="assertive">
  <div id="answerResultPlayer" class="answer-result-player"></div>
  <div id="answerResultMessage" class="answer-result-message"></div>
  <div id="answerResultCorrect" class="answer-result-correct hidden"></div>
</div>
<div id="winnerScreen" class="winner hidden" role="status" aria-live="assertive">
  <div class="winner-card">
    <div class="winner-kicker">MATCH COMPLETE</div>
    <div id="winnerRole" class="winner-role"></div>
    <div id="winnerName" class="winner-name"></div>
    <div id="winnerMessage" class="winner-message"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/display.js"></script>
<script src="/js/timer-display.js"></script>
</body>
</html>
