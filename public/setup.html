
<!DOCTYPE html>
<html>
<head>
  <title>Cyber Chase Setup</title>
  <link rel="stylesheet" href="/css/setup.css">
</head>
<body>
<div class="container">
  <h1>CYBER CHASE</h1>
  <h2>New Match Setup</h2>

  <label>Contestant Name</label>
  <input id="contestantName" type="text">

  <label>Department</label>
  <input id="contestantDepartment" type="text">

  <label>Select Chaser</label>
  <select id="chaserName">
    <option>Rob</option>
    <option>Julian</option>
    <option>Albert</option>
    <option>Noel</option>
  </select>

  <button id="startBtn">START MATCH</button>

  <div id="status"></div>
</div>

<script src="/js/setup.js"></script>
</body>
</html>
