<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Chase Chasers</title>
  <link rel="stylesheet" href="/css/setup.css">
</head>
<body>
<main class="showcase">
  <header class="showcase-header">
    <div class="brand-rule red-rule"></div>
    <div class="showcase-brand">
      <div class="brand-kicker">CYBER SMART WEEK</div>
      <h1>CYBER CHASE</h1>
      <div class="showcase-title">MEET THE CHASERS</div>
    </div>
    <div class="brand-rule blue-rule"></div>
  </header>

  <div class="showcase-intro">
    <span>FOUR SECURITY SPECIALISTS</span>
    <strong>ONE TEAM</strong>
    <span>THE CHASE IS ABOUT TO BEGIN</span>
  </div>

  <section class="showcase-main" aria-label="Chaser profiles and tournament scores">
    <div id="chaserGallery" class="chaser-gallery" aria-label="Chaser profiles"></div>
    <aside id="tournamentScorePanel" class="tournament-score-panel" aria-label="Live tournament scores">
      <div class="scoreboard-kicker">LIVE TOURNAMENT</div>
      <h2 id="tournamentName">No live tournament</h2>
      <ol id="tournamentTeams" class="tournament-teams"></ol>
      <div id="tournamentEmpty" class="tournament-empty">Open a tournament from the presenter console to start tracking winning teams.</div>
    </aside>
  </section>

  <footer class="showcase-footer">
    <div class="footer-rule"></div>
    <div class="showcase-status">
      <span class="status-dots status-dots-left" aria-hidden="true">
        <span class="status-dot pulse-step-3"></span>
        <span class="status-dot pulse-step-2"></span>
        <span class="status-dot pulse-step-1"></span>
      </span>
      <span id="status" role="status" aria-live="polite">Loading chaser profiles...</span>
      <span class="status-dots status-dots-right" aria-hidden="true">
        <span class="status-dot pulse-step-1"></span>
        <span class="status-dot pulse-step-2"></span>
        <span class="status-dot pulse-step-3"></span>
      </span>
    </div>
    <div class="footer-rule"></div>
  </footer>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/setup.js"></script>
</body>
</html>
